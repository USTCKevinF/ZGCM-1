[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zgcm-data-pipeline"
version = "0.1.0"
description = "Normalized, category-oriented data cleaning pipelines for ZGCM-1"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zgcm-clean = "zgcm_data_pipeline.cli:main"
zgcm-pretrain-clean = "zgcm_data_pipeline.stages.pretrain.cli:main"
zgcm-midtrain-clean = "zgcm_data_pipeline.stages.midtrain.cli:main"
zgcm-posttrain-clean = "zgcm_data_pipeline.stages.posttrain.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
