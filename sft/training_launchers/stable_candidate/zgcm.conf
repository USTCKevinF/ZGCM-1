# Stable SFT configuration based on the 256K ThinkMix V1 + Locate run.
RUN_NAME=zgcm7b-sft-thinkmix-v1-locate-256k-fa3-tpcomm-tp8-g48-lr1e4-cos1e6-nowarmup-wd001-eps1e8-10ep-rope10m-maxpos256k-192g

# Dataset identity guards. Actual token/record counts are read from
# DATASET_METADATA by launch.sh and are the only inputs to iteration accounting.
EXPECTED_TRAIN_TOKENS=19462049882
EXPECTED_TRAIN_RECORDS=76325
EPOCHS=10
SAVE_EVERY_EPOCHS=1
MIX_TRAIN_WEIGHT_QCORE=0.9863261526091283
MIX_TRAIN_WEIGHT_THINK=0.01367384739087167
MIX_TRAIN_WEIGHT_TOOL=0.0
QCORE_TRAIN_RECORDS=75242
QCORE_TRAIN_TOKENS=19195928782
THINK_TRAIN_RECORDS=1083
THINK_TRAIN_TOKENS=266121100
TOOL_TRAIN_RECORDS=0
TOOL_RAW_RECORDS=0
TOOL_TRAIN_TOKENS=0
TOOL_LABELED_TOKENS=0

# Model architecture.
NUM_LAYERS=32
HIDDEN_SIZE=4096
FFN_HIDDEN_SIZE=11008
NUM_ATTENTION_HEADS=32
NUM_QUERY_GROUPS=8
KV_CHANNELS=128
VOCAB_SIZE=154880
MAKE_VOCAB_SIZE_DIVISIBLE_BY=128
SEQ_LENGTH=262144
MAX_POSITION_EMBEDDINGS=262144
ROTARY_BASE=10000000
ROTARY_PERCENT=0.334
WINDOW_SIZE=127,0
WINDOW_ATTN_SKIP_FREQ=6
NORM_EPSILON=1e-6
SEED=6198

# Parallelism and batch size.
WORKER_NUM=24
GPUS_PER_WORKER=8
NPROC_PER_NODE=8
TP_SIZE=8
PP_SIZE=1
CP_SIZE=1
VIRTUAL_PIPELINE_LAYERS=0
MICRO_BATCH_SIZE=1
GLOBAL_BATCH_SIZE=48

# Optimizer and schedule.
OPTIMIZER=muon
LR=1e-4
MIN_LR=1e-6
LR_DECAY_STYLE=cosine
LR_WARMUP_ITERS=0
WEIGHT_DECAY=0.01
ADAM_BETA1=0.9
ADAM_BETA2=0.95
ADAM_EPS=1.0e-8
CLIP_GRAD=1.0
MUON_MOMENTUM=0.9
MUON_SCALE_MODE=spectral
MUON_FP32_MATMUL_PREC=medium
MUON_COEFFICIENT_TYPE=quintic
MUON_NUM_NS_STEPS=5
MUON_TP_MODE=blockwise
MUON_EXTRA_SCALE_FACTOR=1.0
MUON_SCALAR_OPTIMIZER=adam

# Precision, attention, recompute, and communication.
ATTENTION_MODE=fa3
ATTENTION_BACKEND=flash
RECOMPUTE_MODE=full
RECOMPUTE_GRANULARITY=full
RECOMPUTE_METHOD=uniform
RECOMPUTE_NUM_LAYERS=1
ENABLE_GRAD_REDUCE_OVERLAP=1
ENABLE_PARAM_GATHER_OVERLAP=1
ENABLE_TP_COMM_OVERLAP=1
TP_COMM_OVERLAP_CFG=
ENABLE_P2P_OVERLAP=1
ENABLE_GRAD_ACCUM_FUSION=0
ENABLE_CKPT_FULLY_PARALLEL_LOAD=1
ENABLE_FP8_PARAM_GATHER=1

# Data, evaluation, checkpointing, and logging.
DATALOADER_TYPE=cyclic
DATASET_BUILDER_THREADS=64
NUM_WORKERS=0
EVAL_ITERS=20
ENABLE_SAVE=1
ENABLE_SWANLAB=0
SWANLAB_PROJECT=zgcm-s4-sft
DISTRIBUTED_TIMEOUT_MINUTES=120
